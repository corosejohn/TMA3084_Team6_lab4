name: Flutter CI

on:
  push:
    branches: [ "103739_Corina", "main" ]
  pull_request:
    branches: [ "103739_Corina", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: pizza_store_app

      - name: Analyze code
        run: flutter analyze
        working-directory: pizza_store_app

      - name: Run tests
        run: flutter test
        working-directory: pizza_store_app